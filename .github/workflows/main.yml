name: Extract God of War III Remastered PS4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path input_wad, output | Out-Null

          if (!(Test-Path "wad.zip")) {
              throw "wad.zip tidak ditemukan di root repository!"
          }

          Expand-Archive -Path "wad.zip" -DestinationPath "temp_wad" -Force

          $files = Get-ChildItem "temp_wad" -Recurse -File |
              Where-Object { $_.Extension -ieq ".wad" }

          if ($files.Count -eq 0) {
              throw "Tidak ditemukan file .WAD di dalam wad.zip!"
          }

          foreach ($file in $files) {
              Copy-Item $file.FullName "input_wad/$($file.Name)" -Force
          }

          Write-Host "Jumlah WAD ditemukan: $($files.Count)"

      - name: Download GoW3 Extractor
        shell: pwsh
        run: |
          $api = "https://api.github.com/repos/jpthebaby/GOW-3-PS4-Remastered-Model-Extractor/releases/latest"

          $release = Invoke-RestMethod `
              -Uri $api `
              -Headers @{ "User-Agent" = "GitHub-Actions" }

          $asset = $release.assets |
              Where-Object { $_.name -eq "JPGow3_Extractor_v1.0.zip" } |
              Select-Object -First 1

          if (!$asset) {
              throw "Extractor ZIP tidak ditemukan pada release!"
          }

          Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile "extractor.zip"

          Expand-Archive `
              -Path "extractor.zip" `
              -DestinationPath "extractor" `
              -Force

      - name: Run WAD Extractor
        shell: pwsh
        run: |
          $exe = Get-ChildItem "extractor" -Recurse -Filter "*.exe" |
              Where-Object { $_.Name -eq "JPGow3 Extractor.exe" } |
              Select-Object -First 1

          if (!$exe) {
              throw "JPGow3 Extractor.exe tidak ditemukan!"
          }

          Write-Host "Extractor: $($exe.FullName)"
          Write-Host "Memulai ekstraksi WAD..."

          & $exe.FullName --cli `
              (Resolve-Path "input_wad").Path `
              (Join-Path $PWD "output")

          if ($LASTEXITCODE -ne 0) {
              throw "Extractor gagal dengan exit code $LASTEXITCODE"
          }

      - name: Check Output
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== HASIL EKSTRAKSI ==="

          if (Test-Path output) {
              Get-ChildItem output -Recurse -File |
                  Group-Object Extension |
                  Format-Table Name, Count
          }

      - name: Upload Extracted Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOW3-PS4-Extracted
          path: output/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
